# nginx proxy address - http://172.17.0.1:5212

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "5m"
    max-file: "1"

services:
  cloudreve:
    image: cloudreve/cloudreve:latest
    container_name: cloudreve-app
    restart: unless-stopped
    logging: *default-logging
    networks:
      - cloudreve
    ports:
      - "5212:5212"
    environment:
      TZ: ${TZ:-America/New_York}
      PUID: ${SERVICE_USER:-1000}
      PGID: ${SERVICE_GROUP:-1000}
    volumes:
      - ./volumes/config/cloudreve:/config
      - ./volumes/data/cloudreve:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5212"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  cloudreve:
    external: false
